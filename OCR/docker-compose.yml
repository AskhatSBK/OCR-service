services:
  app:
    container_name: ocr
    build:
      context: .
    volumes:
      - ./:/app
    ports:
      - "9150:8000"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s



