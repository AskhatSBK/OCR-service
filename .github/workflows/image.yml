name: Service image

on:
  pull_request:
    paths: ["OCR/**", ".github/workflows/image.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ocr-service

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build once into the local Docker engine so the exact image can be tested.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ./OCR
          platforms: linux/amd64
          load: true
          tags: ocr-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test inside the image
        run: |
          docker run --rm --entrypoint bash -v "$PWD/OCR/tests:/app/tests:ro" ocr-service:ci \
            -c "pip install -q --user pytest==8.4.2 && python -m pytest -q -p no:cacheprovider -W ignore::DeprecationWarning tests"

      - name: Image tags
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same build inputs + warm cache => pushes the image that was just tested.
      - name: Push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./OCR
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
