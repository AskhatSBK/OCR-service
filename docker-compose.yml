version: '3.8'

services:
  dots-ocr:
    image: rednotehilab/dots.ocr:vllm-openai-v0.9.1
    container_name: dots-ocr
    restart: always
    ports:
      - "9105:8000"
    volumes:
      - ./dots.ocr/weights/DotsOCR:/workspace/weights/DotsOCR
    environment:
      - PYTHONPATH=/workspace/weights:$PYTHONPATH
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=all
    runtime: nvidia
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -ex;
        sed -i '/^from vllm\.entrypoints\.cli\.main import main/a from DotsOCR import modeling_dots_ocr_vllm' $(which vllm)
        exec vllm serve /workspace/weights/DotsOCR \
            --tensor-parallel-size 1 \
            --gpu-memory-utilization 0.1 \
            --chat-template-content-format string \
            --served-model-name model \
            --trust-remote-code

  service:
    build:
      context: ./OCR
    container_name: service
    volumes:
      - ./OCR:/app
    ports:
      - "9150:8000"
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 1h
      timeout: 3s
      retries: 3
      start_period: 10s
